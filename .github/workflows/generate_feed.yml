name: Generate Channable Feed

on:
  schedule:
    - cron: '0 3 * * *'   # tous les jours à 3h UTC
  workflow_dispatch:        # déclenchement manuel possible

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install httpx

      - name: Generate feed
        env:
          XML_AUTH_USER: ${{ secrets.XML_AUTH_USER }}
          XML_AUTH_PASS: ${{ secrets.XML_AUTH_PASS }}
        run: python main.py

      - name: Commit and push feed.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add feed.json
          git diff --staged --quiet || git commit -m "chore: update feed.json [$(date -u '+%Y-%m-%d %H:%M')]"
          git push